name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main
      - master

jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files diff
        id: diff
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          else
            git diff HEAD~1 HEAD > diff.txt
          fi
          echo "Diff size: $(wc -c < diff.txt) bytes"

      - name: Run Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          DIFF=$(cat diff.txt | head -c 30000)

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"contents\": [{
                \"parts\": [{
                  \"text\": \"Sen bir senior yazılım mühendisisin. Aşağıdaki kod değişikliklerini incele ve Türkçe detaylı bir code review yap. Şunlara dikkat et: 1) Potansiyel bug'lar ve hatalar, 2) Performans sorunları, 3) Güvenlik açıkları, 4) Kod kalitesi ve okunabilirlik, 5) Best practice'lere uygunluk. Markdown formatında yaz.\n\nKod değişiklikleri:\n\`\`\`diff\n$DIFF\n\`\`\`\"
                }]
              }]
            }")

          REVIEW=$(echo $RESPONSE | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          text = data['candidates'][0]['content']['parts'][0]['text']
          print(text)
          " 2>/dev/null || echo "Review alınamadı. API yanıtı: $RESPONSE")

          COMMENT="## 🤖 Gemini Code Review\n\n$REVIEW"

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            curl -s -X POST \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"body\": \"$(echo "$COMMENT" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')\"}"
            echo "PR'a yorum eklendi."
          else
            echo "Push event - Review:"
            echo "$REVIEW"
          fi
