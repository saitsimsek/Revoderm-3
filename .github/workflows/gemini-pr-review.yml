name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for git diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect PR diff (limited)
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          git diff --unified=3 "$BASE_SHA" "$HEAD_SHA" > pr.diff || true

          # Prevent huge payloads
          MAX_BYTES=180000
          BYTES=$(wc -c < pr.diff || echo 0)

          if [ "$BYTES" -gt "$MAX_BYTES" ]; then
            echo "Diff is $BYTES bytes, truncating to $MAX_BYTES bytes."
            head -c "$MAX_BYTES" pr.diff > pr.diff.truncated
            mv pr.diff.truncated pr.diff
          fi

          echo "diff_path=pr.diff" >> "$GITHUB_OUTPUT"

      - name: Generate Gemini review
        id: gemini
        shell: bash
        env:
          DIFF_FILE: ${{ steps.diff.outputs.diff_path }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, sys, textwrap, urllib.request

          api_key = os.environ["GEMINI_API_KEY"]
          diff_file = os.environ.get("DIFF_FILE", "pr.diff")

          prompt = textwrap.dedent("""\
          You are an expert senior software engineer doing a PR review.
          Review the diff and provide:
          1) Summary of changes
          2) High-risk areas / potential bugs
          3) Security concerns (if any)
          4) Performance concerns (if any)
          5) Suggestions with concrete examples (code snippets if helpful)
          Keep it concise but actionable. Use markdown.
          """)

          try:
              with open(diff_file, "r", encoding="utf-8", errors="replace") as f:
                  diff = f.read()
          except FileNotFoundError:
              diff = ""

          payload = {
              "contents": [
                  {"role": "user", "parts": [{"text": prompt + "\n\n---\n\nDIFF:\n" + diff}]}
              ],
              "generationConfig": {"temperature": 0.2, "maxOutputTokens": 1024},
          }

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              f"models/gemini-1.5-pro:generateContent?key={api_key}"
          )

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})

          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = resp.read().decode("utf-8", errors="replace")
          except Exception as e:
              print(f"Gemini request failed: {e}", file=sys.stderr)
              sys.exit(1)

          resp_json = json.loads(body)

          if "error" in resp_json:
              print("Gemini API Error:", resp_json["error"], file=sys.stderr)
              review_text = "Gemini API returned an error."
          else:
              parts = resp_json.get("candidates", [{}])[0].get("content", {}).get("parts", [])
              review_text = "\n".join([p.get("text", "") for p in parts]).strip() or "No review text returned."

          # Write multiline output to GitHub Actions output
          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a", encoding="utf-8") as out:
              out.write("review<<EOF\n")
              out.write(review_text + "\n")
              out.write("EOF\n")
          PY

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.gemini.outputs.review }}`.trim();
            const pr = context.payload.pull_request;

            const body = [
              "## 🤖 Gemini PR Review",
              review,
              "",
              `_(Triggered by: \`${context.eventName}\` • PR #${pr.number})_`
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });
