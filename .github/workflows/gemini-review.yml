name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Diff alabilmek için gerekli

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Gemini Library
        run: pip install -q -U google-generativeai

      - name: Gemini Review Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<EOF
          import os
          import google.generativeai as genai
          import subprocess
          import json
          from urllib.request import Request, urlopen

          # 1. Gemini Yapılandırması
          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          model = genai.GenerativeModel('gemini-1.5-flash')

          # 2. Değişiklikleri (Diff) Al
          try:
              diff = subprocess.check_output(['git', 'diff', 'HEAD~1', 'HEAD']).decode('utf-8')
          except:
              diff = "Diff alınamadı."

          if not diff or len(diff) < 10:
              print("İncelenecek anlamlı bir değişiklik bulunamadı.")
              exit(0)

          # 3. Gemini'ye Sor
          prompt = f"Aşağıdaki kod değişikliklerini bir senior developer gibi incele. Kritik hataları ve iyileştirme önerilerini Türkçe, kısa maddelerle yaz:\n\n{diff}"
          
          try:
              response = model.generate_content(prompt)
              review_text = response.text
          except Exception as e:
              review_text = f"Gemini analizi sırasında hata oluştu: {str(e)}"

          # 4. GitHub PR'a Yorum Yaz
          url = f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments"
          headers = {
              "Authorization": f"token {os.environ['GITHUB_TOKEN']}",
              "Content-Type": "application/json"
          }
          payload = json.dumps({"body": f"### 🤖 Gemini Kod Analizi\n\n{review_text}"}).encode()
          
          req = Request(url, data=payload, headers=headers, method='POST')
          with urlopen(req) as f:
              print(f"Yorum gönderildi: {f.status}")
          EOF
